<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563eb" />

    <title>BelanjaYuk — Belanja jadi mudah, cepat, dan hemat</title>
    <meta
      name="description"
      content="Ribuan produk pilihan dengan harga terbaik, gratis ongkir, dan pengiriman yang bisa diandalkan."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="BelanjaYuk" />
    <meta
      property="og:description"
      content="Belanja jadi mudah, cepat, dan hemat."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applies the stored theme before first paint. Without this the page
      // renders light for a frame, then flashes to dark once React mounts.
      (function () {
        var stored = localStorage.getItem('belanjayuk.theme');
        var dark =
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
